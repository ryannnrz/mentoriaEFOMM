<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EstudoMilitar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: tema claro/escuro, paletas e cores de status ===== */
:root{--bg:#eef1f5;--sf:#fff;--tx:#17202b;--mu:#667386;--bd:#dde3ea;--cell:#e3e8ee;--sh:0 6px 20px rgba(20,35,60,.07);--ac:#2f5d8f;--ok:#2b9a68;--hot:#ff7a00;--r:18px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--sf:#192029;--tx:#e8edf3;--mu:#92a0b1;--bd:#27313d;--cell:#242d38;--sh:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--sf:#192029;--tx:#e8edf3;--mu:#92a0b1;--bd:#27313d;--cell:#242d38;--sh:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;transition:background .3s,color .3s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:19px;padding:0 10px 16px}.logo small{display:block;font-weight:400;color:var(--mu);font-size:12px}
nav button.nv{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:12px;padding:11px 12px;text-align:left;color:var(--mu);font-weight:600;transition:.2s}
nav button.nv:hover{background:var(--cell)}
nav button.nv.on{background:var(--ac);color:#fff}
main{padding:28px;max-width:1000px;width:100%}
#view{min-height:60vh}
.in{animation:slide .4s ease both}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h3{font-size:16px;margin-bottom:12px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.mu{color:var(--mu);font-size:13px}
.av{width:52px;height:52px;border-radius:50%;background:var(--cell);display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.gh{background:var(--cell);color:var(--tx)}
.ib{background:var(--sf);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;font-size:18px}
input[type=text],input[type=number],textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
input[type=number]{width:90px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:10px;background:var(--cell);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .6s}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--cell) 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:10px;background:var(--sf);border-radius:50%}
.ring b{position:relative;z-index:1;font-size:20px}
/* ===== Matérias: abas, acordeões e status ===== */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pills button{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--mu)}
.pills button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lg{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.lg span{display:flex;gap:6px;align-items:center}
.blk{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.bh{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:16px 18px;text-align:left}
.bh b{font-size:16px}.bh .ct{margin-left:auto}
.ch{display:inline-block;transition:transform .3s;font-size:20px;line-height:1;color:var(--mu)}
.open .ch{transform:rotate(90deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.open>.bd{grid-template-rows:1fr}
.bd>div{overflow:hidden;padding:0 18px}
.open>.bd>div{padding-bottom:10px}
.tp{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--bd);padding:10px 4px;text-align:left}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--bd);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;transition:.2s}
.s1 .ck{background:var(--ok);border-color:var(--ok)}
.s2 .ck{background:var(--hot);border-color:var(--hot)}
.s2 .tg{color:var(--hot);font-weight:600}.s1 .tg{color:var(--ok);font-weight:600}
.tg{margin-left:auto;font-size:12px;color:var(--mu);white-space:nowrap}
.tp:hover{background:var(--cell)}
/* ===== Tarefas e erros ===== */
.todo{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.todo input{width:20px;height:20px;accent-color:var(--ac)}
.todo span{transition:.25s}
.todo.d span{text-decoration:line-through;color:var(--mu)}
.rs{background:none;border:0;color:var(--mu);padding:4px 8px;border-radius:8px;margin-left:auto}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 2px var(--bd)}
.sw.on{box-shadow:0 0 0 2px var(--tx)}
.em{font-size:26px;background:var(--cell);border:2px solid transparent;border-radius:12px;width:48px;height:48px}
.em.on{border-color:var(--ac)}
.qt{font-size:20px;line-height:1.4;min-height:84px}
/* ===== Skeleton ===== */
.sk{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--cell) 25%,var(--bd) 50%,var(--cell) 75%);background-size:200% 100%;animation:sh 1.1s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
/* ===== Boas-vindas ===== */
#wel{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:20px;animation:fd .8s ease both}
@keyframes fd{from{opacity:0}to{opacity:1}}
#wel .card{max-width:460px;width:100%;text-align:center;animation:up .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
#wel h1{font-size:32px;margin-bottom:6px}
.hide{display:none!important}
@media(max-width:820px){
 #app{grid-template-columns:1fr;padding-bottom:74px}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;z-index:10;border:0;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 nav .logo{display:none}nav button.nv{flex-direction:column;gap:0;font-size:11px;padding:6px 8px}
 main{padding:18px}.g3,.g2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Ajustes v3: mobile, blocos concluídos, tarefas, zen ===== */
body{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
input[type=text],input[type=number],textarea,select{font-size:16px}
#app{min-height:100dvh}
.chip{display:inline-block;vertical-align:middle;background:var(--cell);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px}
.stats{grid-template-columns:repeat(4,1fr)}
.rc{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.stats .ring{width:80px;height:80px}.stats .ring::after{inset:9px}
.blk.done{border-color:var(--ok)}
.blk.done .bh{background:color-mix(in srgb,var(--ok) 16%,var(--sf))}
.blk.done .bh b,.blk.done .ct{color:var(--ok);font-weight:700}
.bh{min-height:56px}.tp{min-height:52px}
.todo{padding:12px 0;transition:opacity .22s,transform .22s}
.todo.out{opacity:0;transform:translateX(24px)}
.todo input{width:24px;height:24px;flex:none}
.todo span{background:linear-gradient(currentColor,currentColor) 0 55%/0 2px no-repeat;transition:background-size .35s ease,color .35s;word-break:break-word}
.todo.d span{text-decoration:none;background-size:100% 2px;color:var(--mu)}
.gm{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}.gm.ok b{color:var(--ok)}
body.zen nav,body.zen .who{display:none}
body.zen #app{grid-template-columns:1fr;padding-bottom:0}
body.zen main{margin:0 auto}body.zen .top{justify-content:flex-end}
@media(min-width:821px){nav{height:100dvh}}
@media(max-width:820px){
 main{padding:16px 14px}.top h2{font-size:19px}
 .stats{grid-template-columns:1fr 1fr}.big{font-size:28px}
 .card .row input[type=number]{flex:1;min-width:70px}.card .row>.btn{flex:1 1 auto}
 .pills{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 16px;padding:0 14px;scrollbar-width:none}
 .pills button{white-space:nowrap;min-height:44px}
 nav button.nv{flex:1;justify-content:center;min-height:54px;font-size:11px;gap:2px}
 nav button.nv .ic{font-size:22px;line-height:1}
 .tg{font-size:11px}
}
/* ===== v4: visual colorido e planejador ===== */
nav button.nv .ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-size:16px;line-height:1}
.pills button.on{background:var(--sc,var(--ac));border-color:var(--sc,var(--ac))}
.blk{border-left:5px solid var(--sc,var(--bd))}.blk.done{border-color:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--bd);background:var(--bg);border-radius:12px;font-weight:600;font-size:13px;padding:4px}
.seg button.on{color:#fff;border-color:transparent}.seg .l0.on{background:#ef4444}.seg .l1.on{background:#eab308}.seg .l2.on{background:#22c55e}
details summary{cursor:pointer;padding:8px 0}.bs{width:auto;min-width:150px;flex:1}
.wd{display:flex;gap:6px;flex-wrap:wrap}.wd button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);font-weight:600}
.wd button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dy{margin:12px 0 0;font-weight:700;text-transform:capitalize}
.hb{display:flex;justify-content:space-between;gap:8px}.hb span{font-size:13px}
.pv{display:flex;align-items:center;gap:14px}.pv .av{width:72px;height:72px;font-size:38px}
/* ===== v5: paleta sóbria, edital, planejador ===== */
:root[data-accent="blue"]{--ac:#3f6fa8}:root[data-accent="green"]{--ac:#3f8a6a}:root[data-accent="purple"]{--ac:#6f5fae}:root[data-accent="coral"]{--ac:#b0594c}:root[data-accent="mono"]{--ac:#5c6b7a}
.card{border-top:1px solid var(--bd)}
.seg .l0.on,.seg .l1.on,.seg .l2.on{background:var(--ac)}
.blk{border-left-width:3px}
.bh,.blk{position:relative}.bh{padding-bottom:18px}
.mb{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--cell)}.mb i{display:block;height:100%;background:var(--ac);transition:width .5s}.blk.done .mb i{background:var(--ok)}
.tp{min-height:58px;font-size:16px}.ck{width:28px;height:28px;border-radius:9px;font-size:13px}
input[type=date]{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;font-size:16px;min-height:44px}
.dr .dtg{width:120px;min-height:44px;border:1px solid var(--bd);background:var(--bg);border-radius:12px;font-weight:600;text-align:left;padding:0 12px}
.dr .dtg.on{background:var(--ac);border-color:var(--ac);color:#fff}.dr select{flex:1}
.warn{background:color-mix(in srgb,var(--hot) 12%,var(--sf));border:1px solid var(--hot);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.kd{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.kd span{background:var(--cell);border-radius:99px;padding:3px 10px;font-size:12px}
.todo small{color:var(--mu)}
@media(max-width:820px){.dr .dtg{width:104px;padding:0 8px}}
/* ===== v6: verde completo, semanas vencidas e mentorias salvas ===== */
.blk.done{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 35%,transparent),var(--sh)}
.blk.done .bh{background:var(--ok)}
.blk.done .bh b,.blk.done .ct,.blk.done .ch{color:#fff}
.blk.done .mb{background:rgba(255,255,255,.35)}.blk.done .mb i{background:#fff}
.sv{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sv .inf{flex:1;min-width:210px}.sv .btn{padding:8px 14px}
.on-t{background:var(--ok);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:8px}
.lvt{color:var(--ac);font-weight:600}
@media(max-width:820px){nav button.nv{padding:6px 2px}}
/* ===== v7: gradientes sutis ===== */
body{background:radial-gradient(1100px 480px at 8% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(800px 420px at 100% 0,color-mix(in srgb,var(--hot) 9%,transparent),transparent 70%),var(--bg)}
.card,.blk{background-image:linear-gradient(160deg,transparent 40%,color-mix(in srgb,var(--ac) 7%,transparent))}
.btn{background-image:linear-gradient(135deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac) 45%,color-mix(in srgb,var(--ac) 72%,#000))}
.btn.gh{background-image:none}
nav button.nv.on{background-image:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac))}
.bar i,.mb i{background-image:linear-gradient(90deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac))}
.blk.done .bh{background-image:linear-gradient(135deg,color-mix(in srgb,var(--ok) 80%,#fff),var(--ok) 55%,color-mix(in srgb,var(--ok) 75%,#000))}
.blk.done .mb i{background-image:none}
.seg button.on{background-image:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac))}
/* ===== v8: mentoria interativa, canal, perfil, painel ===== */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flo{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.07)}}
.wz{max-width:760px;margin:0 auto;animation:up .5s ease both}
.wz.hero{text-align:center;padding:34px 20px;border-radius:26px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#1e3a8a,#0e7490 55%,#0f766e);box-shadow:var(--sh)}
.wz.hero h2{font-size:clamp(26px,6vw,38px);margin:8px 0}.wz.hero p{opacity:.92;max-width:520px;margin:0 auto 20px}
.orb{position:absolute;width:280px;height:280px;border-radius:50%;right:-80px;top:-100px;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 70%);animation:flo 6s ease-in-out infinite}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.stp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 0 24px;text-align:left}
.stp>div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:14px;animation:up .6s ease both;animation-delay:var(--d)}
.stp b{display:block;font-size:24px}.stp span{font-size:13px;opacity:.85}
.btn.big{min-height:52px;padding:0 30px;font-size:17px;border-radius:14px;background-color:#fff;background-image:none;color:#0f3c6e;font-weight:700}
.btn.wl{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--ln,rgba(130,140,160,.35));background-color:var(--sf);color:inherit;font:inherit;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;animation:up .45s ease both;animation-delay:calc(var(--i,0)*55ms)}
.opt:hover{transform:translateY(-2px);border-color:var(--ac)}
.opt.on{border-color:var(--ac);background-image:linear-gradient(135deg,color-mix(in srgb,var(--ac) 24%,transparent),transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.opt b{font-size:28px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .opt{width:auto;padding:10px 16px;border-radius:99px}
.pg{height:8px;border-radius:99px;background:var(--cell);overflow:hidden;margin:6px 0 18px}.pg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#38bdf8,var(--ac));transition:width .5s ease}
.fr{font-size:clamp(17px,4vw,21px);line-height:1.5;margin:14px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 18%,transparent),color-mix(in srgb,var(--hot) 14%,transparent));animation:up .5s ease both}
.hero2{display:flex;align-items:center;gap:16px;padding:22px;border-radius:22px;color:#fff;margin-bottom:16px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--sh)}
.hero2 img{width:78px;height:78px;object-fit:contain;border-radius:16px;background:rgba(255,255,255,.92);padding:6px}.hero2 .em2{font-size:48px}
.stats .card{border-top:4px solid var(--cc);background-image:linear-gradient(160deg,color-mix(in srgb,var(--cc) 16%,transparent),transparent 65%)}.stats .big{color:var(--cc)}
/* ===== v9: cards de curso, nivelamento, prévia do dia ===== */
@keyframes grow{from{flex-grow:0;opacity:0}}
.ban{position:relative;overflow:hidden;text-align:center;padding:22px 14px 18px;color:#fff;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.22),transparent 60%),linear-gradient(160deg,var(--g1),var(--g2))}
.ban h4{margin:12px 0 0;font-size:clamp(34px,9vw,46px);line-height:1;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.ban .bs{margin-top:6px;font-size:clamp(18px,5vw,26px);font-weight:800;text-transform:uppercase}
.lgc{display:inline-flex;width:84px;height:84px;border-radius:50%;background:#fff;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.16),0 0 0 12px rgba(255,255,255,.08),0 0 34px 8px var(--gl,rgba(80,160,255,.5))}
.lgc img{width:84%;height:84%;object-fit:contain}.lgc em{font-style:normal;font-size:40px}
.pro{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:4px 16px 4px 6px;border-radius:12px;background:linear-gradient(135deg,#38a1ff,#1565d8);font-weight:800;font-size:22px}
.pro u{text-decoration:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e0a21a;font-size:14px;box-shadow:0 0 0 3px rgba(224,162,26,.35)}
.mc{border-radius:20px;overflow:hidden;border:1.5px solid var(--ln,rgba(130,140,160,.3));background-color:var(--sf);box-shadow:var(--sh);animation:up .5s ease both;transition:transform .2s}.mc:hover{transform:translateY(-3px)}
.mc.on{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent),var(--sh)}
.mc-b{padding:14px 16px 16px;display:grid;gap:8px}.tag{border:1px solid var(--ln,rgba(130,140,160,.45));border-radius:99px;padding:2px 12px;font-size:12px}
.mcg{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tile{border:0;border-radius:18px;padding:16px 8px;color:#fff;cursor:pointer;text-align:center;font:inherit;background:linear-gradient(160deg,var(--g1),var(--g2));animation:up .45s ease both;animation-delay:calc(var(--i,0)*55ms);transition:transform .2s,box-shadow .2s;outline:3px solid transparent}
.tile:hover{transform:translateY(-3px)}.tile.on{outline-color:#fff;box-shadow:0 0 0 6px var(--g2)}

/* ===== v10: temas, brasões, mentoria, semanas e personalização ===== */
:root[data-theme="midnight"]{--bg:#05070b;--sf:#0d1118;--tx:#e9eef6;--mu:#8d9aae;--bd:#1a222d;--cell:#151c26;--sh:0 8px 24px rgba(0,0,0,.55);color-scheme:dark}

:root[data-theme="forest"]{--bg:#0c1712;--sf:#13241b;--tx:#e5f0e9;--mu:#92ac9d;--bd:#1f3a2c;--cell:#1a3024;--sh:0 8px 24px rgba(0,15,8,.5);color-scheme:dark}
:root[data-theme="graph"]{--bg:#15171b;--sf:#202328;--tx:#e9ebef;--mu:#9aa1ad;--bd:#2d3138;--cell:#292d34;--sh:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
:root[data-theme="sky"]{--bg:#e4f1fb;--sf:#fff;--tx:#10283f;--mu:#5b7690;--bd:#cfe2f2;--cell:#dcebf7;--sh:0 8px 22px rgba(20,80,140,.1);color-scheme:light}
:root[data-theme="sand"]{--bg:#f2ece0;--sf:#fffaf1;--tx:#2b2418;--mu:#7a6e5a;--bd:#e4dac6;--cell:#ece3d0;--sh:0 8px 22px rgba(90,70,30,.09);color-scheme:light}
:root[data-accent="navy"]{--ac:#1e3a8a}:root[data-accent="sky"]{--ac:#0b7fc0}:root[data-accent="teal"]{--ac:#0f8f87}:root[data-accent="olive"]{--ac:#667a24}:root[data-accent="gold"]{--ac:#b07d0e}:root[data-accent="orange"]{--ac:#d4631a}:root[data-accent="red"]{--ac:#c0392b}:root[data-accent="pink"]{--ac:#c0397b}
html[data-rd="s"]{--r:8px}html[data-rd="l"]{--r:28px}
html[data-fs="s"] body{font-size:13.5px}html[data-fs="l"] body{font-size:17px}

.nvb{display:flex;gap:6px}.nvb button{min-width:40px;min-height:40px;border:1px solid var(--bd);background:var(--bg);border-radius:10px;font-weight:600;padding:0 8px}.nvb button:disabled{opacity:.4}.nvb button.on{background:var(--ac);border-color:var(--ac);color:#fff}

.wh{display:grid;gap:8px;margin-bottom:6px}.steps{display:flex;gap:5px}.steps i{flex:1;height:6px;border-radius:99px;background:var(--cell);transition:.3s}.steps i.d{background:var(--ac)}.steps i.c{background:color-mix(in srgb,var(--ac) 45%,var(--cell))}

     ${P.fs?`<p class="mu">Fases: passada em nível médio em todas as matérias, depois nível difícil${P.maxP>=4?", depois muito difícil":""}, e reta final com provas anteriores (${P.fs[2]} dias).</p>`:""}<b>Horas por matéria${P.alto?" (alta exigência: mais peso em Matemática e Inglês)":""}</b>

}

document.addEventListener("click",e=>{

  const a=b.dataset.a,k=b.dataset.k,i=+b.dataset.i,n=id=>parseFloat($(id).value)||0;
  if(a=="blk"){const o=!b.parentElement.classList.contains("open");OP[k]=o;b.parentElement.classList.toggle("open",o);save();return} // acordeão animado
  if(a=="tdel"){b.closest(".todo").classList.add("out");setTimeout(()=>{S.todos.splice(i,1);save();draw()},230);return}
  if(a=="wstart"){S.mm="completa";S.mw="q";S.qs=0;save();draw();return}
  if(a=="wmode"){S.mm=k;S.mw="q";S.qs=0;save();draw();return}
  if(a=="wsel"){wsel(k,b.dataset.v);return}
  if(a=="wniv"){const m=k.split("|")[0],i=+k.split("|")[1],A=(S.qa.niv=S.qa.niv||{});(A[m]=A[m]||[])[i]=+b.dataset.v;b.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x==b));save();return}
  if(a=="wmul"){const A=S.qa.hard=S.qa.hard||[],x=A.indexOf(k);x<0?A.push(k):A.splice(x,1);b.classList.toggle("on",x<0);save();return}
  if(a=="wnext"){S.qs++;save();draw();return}
  if(a=="wback"){if(S.qs>0)S.qs--;else S.mw="modo";save();draw();return}
  if(a=="nova"){S.mw="intro";S.qs=0;save();draw();return}
  if(a=="lgx"){delete S.logos[S.car];save();draw();return}
  if(a=="mood"){S.mood=k;S.fi=Math.floor(Math.random()*10);save();draw();return}
  if(a=="mtx"){const t=($("#mt").value||"").trim();S.mtx=t;if(t)S.mood=detect(t);S.fi=Math.floor(Math.random()*10);save();draw();return}
  if(a=="fnext"){S.fi=(S.fi+1)%10;save();draw();return}
  if(a=="lg"){S.lg=+b.dataset.l;save();draw();return}
  if(a=="lv"){S.lv[b.dataset.m]=+b.dataset.l;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x==b));save();return}
  if(a=="wd"){const L=S.pf.days,x=L.indexOf(i);x<0?L.push(i):L.splice(x,1);b.classList.toggle("on",x<0);const sl=b.nextElementSibling;if(sl)sl.disabled=x>=0;save();wkTxt();return}

  if(a=="load"){const e=S.sv.find(x=>x.id==k);if(e){act(e);Object.assign(S,JSON.parse(JSON.stringify(e.f)));save();go("plan")}return}
  if(a=="sdel"){if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmar exclusão?";return}S.sv=S.sv.filter(x=>x.id!=k);if(S.cur==k){S.cur=0;S.plan=null;S.pd={}}save();draw();return}
  if(a=="avurl"){ // testa a imagem antes de salvar o link
    const u=$("#pl").value.trim(),m=$("#plm");if(!u)return;m.textContent="Carregando imagem...";
    const im=new Image();im.onload=()=>{S.av=u;save();applyTheme();draw()};
    im.onerror=()=>{m.textContent="Não consegui carregar essa imagem. Confira o link ou envie o arquivo do aparelho."};im.src=u;return;
  }
  if(a=="topic"){S.st[k]=((S.st[k]||0)+1)%3} // pendente → revisado → aprofundado → pendente
  else if(a=="subj"){MS=k;S.ms=k}
  else if(a=="flt"){S.flt=k}
  else if(a=="gadd"){const m=$("#gmm").value;S.gm.push({m,n:Math.max(1,Math.round(n("#gn"))),d:$("#gdy").value,b:cnt(m)})}
  else if(a=="gdel"){S.gm.splice(i,1)}
  else if(a=="pclr"){S.sv=S.sv.filter(x=>x.id!=S.cur);S.cur=0;S.plan=null;S.pd={}}
  else if(a=="quote"){qi=(qi+1+Math.floor(Math.random()*(QUOTES.length-1)))%QUOTES.length}
  else if(a=="todo"){const t=$("#tdi").value.trim();if(t){S.todos.unshift({t,d:false});S.flt=S.flt=="done"?"all":S.flt}}
  else if(a=="tclr"){S.todos=S.todos.filter(t=>!t.d)}
  else if(a=="av"){S.av=k}
  else if(a=="acc"){S.accent=k}
  else if(a=="theme"){S.theme=S.theme=="dark"?"light":"dark"}
  save();applyTheme();draw();
  if(a=="todo"){const x=$("#tdi");x&&x.focus()} // pronto para a próxima tarefa
});

  }
});

/* Divide UM assunto em partes (já na ordem). Parte pequena demais se junta à vizinha; parte grande demais vira duas ou mais.
   Devolve [{h, subs:[...]}] — a numeração "parte i de n" é feita depois, uma única vez por assunto e por fase. */
function topicParts(m,nm,h,p,minB,maxB){
  const sp=SPD[m+"|"+nm];let ps;
  if(sp){

  o.innerHTML=`<div class="mdc" role="dialog" aria-modal="true"><h3>O que mudou no seu plano</h3><p class="mu" style="margin:0 0 8px">Você concluiu “${esc(f?f.x.t:"")}” em ${mwFh(ah)}, ${mwFh(Math.abs(d))} ${d>0?"antes":"depois"} do prazo recomendado (${mwFh(h0)}).</p><p style="margin:0">${esc(P.msg||"")}</p>${L.length?`<ul>${L.join("")}</ul>`:""}<p class="mu" style="margin:10px 0 0">Se marcou errado, use Desfazer: as horas voltam como estavam.</p><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn gh" data-mc="undo" data-k="${k}">Desfazer</button><button class="btn" data-mc="ok">Entendi</button></div></div>`;
  document.body.appendChild(o)}
function burst(o,x,y,c){for(let i=0;i<22;i++){const p=document.createElement("i"),a=Math.PI*2*i/22,d=70+Math.random()*80;p.className="spk";p.style.cssText=`left:${x}px;top:${y}px;background:${c};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d+30}px`;o.appendChild(p)}}
function celebrate(t,s){
  const o=document.createElement("div");o.className="cel";o.innerHTML=`<div class="cel-c"><div class="cel-e">🎉</div><h2>${esc(t)}</h2><p>${esc(s)}</p><button class="btn">Continuar</button></div>`;document.body.appendChild(o);
  const cols=["#ff4d6d","#ffd23f","#3ddc97","#4f8cff","#ff9f43","#a66cff"];
  if(S.ui.an&&!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let b=0;b<6;b++)setTimeout(()=>burst(o,innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4),cols[b]),b*260);
  const x=()=>{o.classList.add("out");setTimeout(()=>o.remove(),300)};o.onclick=e=>{if(e.target==o||e.target.tagName=="BUTTON")x()};setTimeout(x,8000)}
function dsAll(){const s=new Set;if(S.plan&&S.plan.v==3)S.plan.weeks.forEach(w=>{if(wkDone(w,S.pd))s.add("w|"+w.n);w.d.forEach(g=>{if(g.m!="Geral"&&g.s.every((x,i)=>S.pd[g.d+"|"+i]))s.add("g|"+w.n+"|"+g.m)})});Object.keys(ED).forEach(m=>{if(ALL.filter(k=>k.startsWith(m+"|")).every(k=>S.st[k]))s.add("m|"+m)});return s}
let DS=null;
function chkCel(){const n=dsAll();if(DS&&celOn()){const nw=[...n].filter(x=>!DS.has(x)),w=nw.find(x=>x[0]=="w"),m=nw.find(x=>x[0]=="m"),g=nw.find(x=>x[0]=="g");
  if(w)celebrate("Parabéns, você concluiu a semana "+w.split("|")[1]+"!","Mais uma etapa fechada rumo à aprovação. Descanse um pouco e siga em frente.");
  else if(m)celebrate("Parabéns, você concluiu a matéria "+m.split("|")[1]+"!","Todos os tópicos dessa matéria estão marcados. Ótimo trabalho!");
  else if(g)celebrate("Parabéns, você concluiu a matéria "+g.split("|")[2]+"!","Você fechou "+g.split("|")[2]+" na semana "+g.split("|")[1]+".")}DS=n}
function todayCard(tp){
  const P=S.plan;if(!P)return `<div class="card tdc" style="--cc:#8b5cf6"><h3>Hoje no cronograma</h3><div class="tde"><span>🧭</span><p class="mu">Você ainda não tem um plano. Monte seu cronograma na aba Mentoria.</p></div></div>`;
  const hh=tp.reduce((a,o)=>a+o.x.h,0),wk=P.v==3?" · semana "+Math.min(curWk(P)+1,P.weeks.length)+" de "+P.weeks.length:"";
  const rows=tp.slice(0,6).map(({x,id})=>`<div class="todo tdr" style="--sc:${SC[x.m]||"var(--ac)"}"><input type="checkbox" data-p="${id}" aria-label="Concluir"><span class="tdb"><b>${x.m=="Geral"?"Simulado":x.m}</b><small>${esc(x.t)}</small></span><span class="tdh">${mwFh(x.h)}</span></div>`).join("");
  return `<div class="card tdc" style="--cc:#8b5cf6"><div class="tdh2"><h3>Hoje no cronograma</h3><span class="mu">${tp.length?tp.length+" pendentes · "+mwFh(hh):"Tudo em dia"}${wk}</span></div>${tp.length?rows:`<div class="tde"><span>✅</span><p class="mu">Nada pendente por agora. Aproveite para descansar ou rever seus erros.</p></div>`}</div>`}
function cfgCard(){const c=LC(),on=celOn(),row=(k,t)=>`<label class="lcr"><input type="color" class="nvc" data-k="${k}" value="${c[k]}" aria-label="${t}"><span>${t}</span></label>`;
  return `<div class="card"><h3>Cores dos níveis</h3><p class="mu" style="margin-top:0">Escolha a cor de cada nível no cronograma e na legenda da mentoria.</p>${row("a","Níveis 1 e 2")}${row("b","Nível 3")}${row("c","Nível 4")}<button class="btn gh" data-x="lvr" style="margin-top:10px">Restaurar cores</button><h3 style="margin:18px 0 6px">Comemorações</h3><button class="tgl ${on?"on":""}" data-x="cel" role="switch" aria-checked="${on}"><i></i><span>Mostrar “Parabéns” ao concluir uma semana ou matéria</span></button></div>`}
const mcBar=()=>{const v=S.ui.mcv||"n",b=(k,t)=>`<button class="${v==k?"on":""}" data-x="ui" data-p="mcv" data-v="${k}">${t}</button>`;return `<div class="mcbar" role="group" aria-label="Tamanho do card da mentoria"><span class="mu">Visualização do card</span>${b("m","Minimizado")}${b("s","Simples")}${b("n","Padrão")}${b("l","Grande")}</div>`};
const XPL=`<div class="xpl"><b>Como funciona a sua mentoria</b><ul><li><b>Semanas.</b> Cada semana reúne as 4 matérias, 3h de leitura de inglês e um simulado no fim.</li><li><b>Assuntos inteiros.</b> Cada assunto aparece de uma vez, com as horas recomendadas. As matérias se revezam para o tempo da semana fechar.</li><li><b>Níveis.</b> Primeiro você aprende a base (níveis 1 e 2), depois treina questões difíceis (nível 3), muito difíceis (nível 4) e faz a reta final com provas anteriores.</li><li><b>Ao concluir.</b> Marque “Concluir” e diga se levou o tempo certo, mais ou menos horas. O plano reajusta o resto e mostra o que mudou. Se errar, é só desfazer.</li></ul></div>`;

function weeksHTML(P){
  if(P.v!=3)return weeksHTMLold(P);
  const fi=P.weeks.findIndex(w=>!wkDone(w,S.pd)),cur0=fi<0?0:fi,fm=i=>new Date(i+"T12:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  return P.weeks.map((w,wi)=>{
    const id="w|"+w.n,o=OP[id]===undefined?wi==cur0:OP[id],all=w.d.reduce((a,g)=>a+g.s.length,0),dn=w.d.reduce((a,g)=>a+g.s.filter((x,i)=>S.pd[g.d+"|"+i]).length,0),done=all>0&&dn==all,hh=w.d.reduce((a,g)=>a+g.s.reduce((b,x)=>b+x.h,0),0);
    const ph=[...new Set(w.d.flatMap(g=>g.s.map(x=>x.p)).filter(p=>p>=2))].map(p=>MWPH[p][0]).join(" e ");
    const body=w.d.map(g=>`<div class="wsb" style="--sc:${SC[g.m]||"var(--ac)"}"><div class="wsh"><span class="dot"></span><b>${g.m=="Geral"?"Simulado"+(P.red?" e redação":""):g.m}</b><span class="mu">${mwFh(g.s.reduce((a,x)=>a+x.h,0))}</span></div>${g.s.map((x,i)=>wItem(x,g.d+"|"+i)).join("")}</div>`).join("");
    return `<div class="blk wx ${o?"open":""} ${done?"wxd":""}"><button class="bh" data-a="blk" data-k="${id}"><span class="wnb">${done?"✓":w.n}</span><span class="wt"><b>Semana ${w.n}</b><span class="mu">${fm(w.a)} a ${fm(w.b)} · ${mwFh(hh)}${ph?" · "+ph:""}</span></span><span class="wst">${done?"Concluída":dn+"/"+all}</span><span class="ch">›</span><span class="mb"><i style="width:${pc(dn,all)}%"></i></span></button><div class="bd"><div>${body}</div></div></div>`}).join("")}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-q]");if(!b)return;const q=b.dataset.q,k=b.dataset.k;let sh=null;
  if(q=="open"){CF=k;CM=null}
  else if(q=="cancel"){CF=null;CM=null}
  else if(q=="mode")CM=b.dataset.v;
  else if(q=="ok"){S.pd[k]=true;const f=findIt(k);if(f&&f.x.pl==null)f.x.pl=f.x.h;if(S.plan)S.plan.msg="";CF=null;CM=null}
  else if(q=="save"){const v=parseFloat(($("#cah")||{}).value),f=findIt(k);if(!(v>0)||!f)return;const pre=snapH(),h0=f.x.h,ah=Math.max(.5,Math.round((CM=="s"?h0+v:h0-v)*2)/2);S.pd[k]=true;realoca(k,ah);f.x.snap=pre;sh=[k,h0,ah,pre];CF=null;CM=null}
  else if(q=="undo")undoIt(k);
  save();draw();if(sh)infoModal(...sh)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-mc]");if(!b)return;const o=b.closest(".mdl");if(b.dataset.mc=="undo"){undoIt(b.dataset.k);save();draw();chkCel()}o.classList.add("out");setTimeout(()=>o.remove(),250)});

document.addEventListener("click",e=>{if(e.target.closest("[data-a=load],[data-a=gen],[data-a=pclr],[data-a=sdel],[data-a=nova]"))setTimeout(()=>{DS=dsAll()},80);else setTimeout(chkCel,80)},true);
